server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

  # Sayfalar her açılışta yeniden doğrulanır (ETag): tarayıcı eski tasarımı önbellekten göstermesin.
  # `expires` add_header değildir: aşağıdaki güvenlik başlıkları konumlarda da geçerli kalır. /assets/ kendi 1y değerini koyar.
  expires -1;

  # __APP_ORIGIN__ derlemede uygulamanın kökeniyle değişir (scripts/build.mjs renderNginx, Dockerfile).
  # connect-src: site.js yalnız uygulamanın "kimim" ve çıkış uçlarına gider (ARCHITECTURE §5 "Tek hesap"). Başka dış kaynak yok.
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' __APP_ORIGIN__; img-src 'self' data:; style-src 'self'; font-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
  }

  location /en/ {
    try_files $uri $uri/index.html =404;
    error_page 404 /en/404.html;
  }

  location / {
    try_files $uri $uri/index.html =404;
  }

  error_page 404 /404.html;
}
