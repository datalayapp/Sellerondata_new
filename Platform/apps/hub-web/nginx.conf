# Merkez statik sunucu. Yönlendirme, CSP ve HSTS gateway'dedir (ARCHITECTURE §3, §11); API buradan geçmez.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Erişim günlüğü gateway ile aynı kuralda: jetonlu yollar maskeli, Referer yazılmaz. Biçim `sod`:
  # Platform/gateway/conf/access-log.conf (imajda conf.d/00-access-log.conf; denetim gateway/test/access-log.test.mjs).
  access_log /var/log/nginx/access.log sod;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Jetonlu sayfalar (davet, şifre sıfırlama, e-posta doğrulama): hata günlüğü yalnız kritik (istek satırını yazmasın), sayfa
  # hiç Referer göndermez. Gateway bu başlığı kendisi de koyar (default.conf $sod_referrer_policy); burada da durur.
  location ~* ^/(invite|reset-password|verify-email)/ {
    error_log /var/log/nginx/error.log crit;
    add_header Cache-Control "no-cache";
    add_header Referrer-Policy "no-referrer" always;
    try_files /index.html =404;
  }

  # Kayıt sayfası: kayıt daveti jetonu sorguda (/register?invite=…, kapalı deneme 2026-11-12). Sayfa hiç Referer göndermez,
  # hata günlüğü istek satırını yazmaz; erişim günlüğünde sorgu maskeli (access-log.conf).
  location ~* ^/+register/?$ {
    error_log /var/log/nginx/error.log crit;
    add_header Cache-Control "no-cache";
    add_header Referrer-Policy "no-referrer" always;
    try_files /index.html =404;
  }

  # Tek sayfalık uygulama: bilinmeyen yol index.html. Eski sekme eski pakete kilitlenmesin diye önbelleksiz.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
