# Araç şablonu (Platform/templates/tool-web/README.md). Karşılığı: Deciship/apps/web/nginx.conf.
# Yalnız statik araç web'i. `/api/*`, güvenlik başlıkları ve yol yönlendirme ağ geçidindedir (ARCHITECTURE §3, §11);
# gateway blokları kayıttan üretilir (`npm run products:gen` → Platform/gateway/conf/products/<anahtar>.conf).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Ağ geçidinin arkasında: yönlendirme iç adresi ve portu sızdırmasın
  absolute_redirect off;
  # Erişim günlüğü gateway ile aynı kuralda: Referer yazılmaz, jetonlu yollar maskeli.
  # Biçim `sod`: Platform/gateway/conf/access-log.conf (imajda conf.d/00-access-log.conf).
  access_log /var/log/nginx/access.log sod;

  location = /ornekarac {
    return 301 /ornekarac/;
  }

  location /ornekarac/assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Sekme "yeni sürüm var" denetimi: önbelleğe alınmaz, yoksa HTML dönmez
  location = /ornekarac/version.json {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location /ornekarac/ {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /ornekarac/index.html;
  }

  location / {
    return 404;
  }
}
