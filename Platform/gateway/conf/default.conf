# SellerOnData gateway. Adres tablosu: docs/ARCHITECTURE.md §3.
#
# Yukarı akış adresleri değişkenle verilir ve Docker DNS ile istek anında çözülür:
# bir servis yeniden başlarsa ya da henüz açılmamışsa gateway açılışta çökmez.
resolver 127.0.0.11 valid=10s ipv6=off;

# Şema: arkada TLS sonlandıran yük dengeleyici varsa onun bildirdiği, yoksa kendi gördüğümüz.
# Başlık yalnız güvenilen vekilden (GATEWAY_REAL_IP_FROM) gelirse geçerli; istemciden geleni yok sayarız.
map "$sod_trusted_proxy:$http_x_forwarded_proto" $sod_scheme {
  default   $scheme;
  "1:https" https;
}
# HSTS uygulamada yalnız burada yazılır (Caddy uygulamaya başlık eklemez; sitenin HSTS'i caddy/Caddyfile `sod_hsts`, aynı değer:
# gateway/test/compose-order.test.mjs denetler). Önce kısa süre, preload yok; uzatmak KALANLAR "Yayından önce".
map $sod_scheme $sod_hsts {
  default "";
  https   "max-age=86400; includeSubDomains";
}

# Erişim günlüğü biçimi `sod` (jetonlu yollar maskeli, Referer yok): conf/access-log.conf, conf.d/00-access-log.conf olarak
# bu dosyadan önce yüklenir. Aynı dosyayı hub-web ve deciship-web imajları da kullanır.

# Referrer-Policy (security-headers.conf). Jetonlu sayfa (davet, şifre sıfırlama, e-posta doğrulama) hiç Referer göndermez:
# jeton ne üçüncü tarafa ne de aynı kökendeki sonraki isteklerin başlığına geçer. Yukarı akış daha sıkısını isterse
# (ör. DeciShip dosya bağlantısı no-referrer) o geçer; gevşeğini isteyemez. Yol harf duyarsız: Merkez yönlendiricisi de öyle.
map "$request_uri|$upstream_http_referrer_policy" $sod_referrer_policy {
  default "strict-origin-when-cross-origin";
  ~*^/+(invite|reset-password|verify-email)/ "no-referrer";
  # Kayıt sayfası: davet jetonu sorguda (/register?invite=…).
  ~*^/+register/?(\?|\|) "no-referrer";
  ~*\|no-referrer$ "no-referrer";
  ~*\|same-origin$ "same-origin";
}

server {
  listen 80 default_server;
  server_name _;

  server_tokens off;
  access_log /var/log/nginx/access.log sod;
  absolute_redirect off;
  merge_slashes on;

  set $account_api  http://account-api:4100;
  set $hub_web      http://hub-web:80;
  # Yapay zekâ geçidi (port contracts AI_GATEWAY_PORT). Araçların yolu (/internal/*) yukarıdaki internal kuralıyla dışarıya kapalı.
  set $ai_api       http://ai-api:4300;

  include /etc/nginx/snippets/security-headers.conf;
  # IP başına eşzamanlı istek, bütün yollarda (templates/conn-limit.inc.template; /api/ konumları api-limits.inc ile aynısını alır).
  include /etc/nginx/conf.d/conn-limit.inc;

  # Yukarı akış yoksa ya da yanıt vermezse
  error_page 502 503 504 = @unavailable;
  # Hız sınırı aşıldı (limit_req ve limit_conn 429 verir; yukarı akışın kendi 429'u buraya düşmez, olduğu gibi geçer).
  # Kod kimlik ucunda TOO_MANY_ATTEMPTS, başka yerde TOO_MANY_REQUESTS ($sod_rl_code, templates/20-limits.conf.template).
  # Retry-After kısa: kovada yer birkaç saniyede açılır; tarayıcı kabuğu GET'i bu kadar bekleyip bir kez yeniden dener,
  # mobil kuyruk bu süreden önce yeniden göndermez.
  error_page 429 = @ratelimited;
  location @ratelimited {
    default_type application/json;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "5" always;
    return 429 '{"error":{"code":"$sod_rl_code"}}';
  }
  location @unavailable {
    default_type application/json;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    return 503 '{"error":{"code":"SERVICE_UNAVAILABLE"}}';
  }

  # Gateway sağlığı (compose healthcheck).
  location = /healthz {
    access_log off;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Yalnız iç ağ: hiçbir yolda, hiçbir büyük/küçük harf biçiminde dışarı açılmaz.
  # nginx eşleştirmeden önce %xx çözer ve ./.. ile // sadeleştirir; regex konum önek konumlarından önce çalışır.
  location ~* (^|/)internal(/|$) {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    default_type application/json;
    return 404 '{"error":{"code":"NOT_FOUND"}}';
  }

  location = / {
    include /etc/nginx/snippets/security-headers.conf;
    return 302 /home;
  }

  # ---------- API ----------
  # Her /api/ konumu api-limits.inc'i alır (genel, yükleme ve kimlik kovaları; test/rate-limits.test.mjs denetler).
  # Sağlık uçları hız sınırının dışındadır (kapların ve izlemenin yoklaması kısılmasın).
  location = /api/account/health {
    include /etc/nginx/snippets/proxy.conf;
    include /etc/nginx/snippets/security-headers.conf;
    gzip off;
    proxy_read_timeout 30s;
    proxy_pass $account_api;
  }

  # Yukarı akış hatası günlüğe isteğin tamamını yazar: jetonlu yollarda yalnız kritik hata.
  location /api/account/invites/ {
    error_log /var/log/nginx/error.log crit;
    include /etc/nginx/conf.d/api-limits.inc;
    include /etc/nginx/snippets/proxy.conf;
    include /etc/nginx/snippets/security-headers.conf;
    client_max_body_size 1m;
    # Sıkıştırılmaz (BREACH): gövdede oturum, yenileme ve davet jetonu döner (conf/gzip.conf).
    gzip off;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_pass $account_api;
  }

  location /api/account/ {
    include /etc/nginx/conf.d/api-limits.inc;
    include /etc/nginx/snippets/proxy.conf;
    include /etc/nginx/snippets/security-headers.conf;
    client_max_body_size 1m;
    # Sıkıştırılmaz (BREACH): gövdede oturum, yenileme ve davet jetonu döner (conf/gzip.conf).
    gzip off;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_pass $account_api;
  }

  # ---------- Yapay zekâ geçidi (ai-api): yalnız Merkez uçları ----------
  # Harcama görünümü (/api/ai/spend/*) ve platform yöneticisi uçları (/api/ai/admin/*), Hesap jetonuyla. Araç vekili ve olay
  # alıcısı /api/ai/internal/* altında: regex kuralı (`internal`) önek konumlarından önce çalışır, dışarıya her zaman 404.
  # Gateway geçidi beklemez (açılış sırası); geçit kapalıyken 503 JSON.
  location = /api/ai/health {
    include /etc/nginx/snippets/proxy.conf;
    include /etc/nginx/snippets/security-headers.conf;
    proxy_read_timeout 30s;
    proxy_pass $ai_api;
  }

  location /api/ai/ {
    include /etc/nginx/conf.d/api-limits.inc;
    include /etc/nginx/snippets/proxy.conf;
    include /etc/nginx/snippets/security-headers.conf;
    # Yönetici uçlarının gövdesi küçük (anahtar, tavan); harcama dışa aktarımı uzun sürebilir.
    client_max_body_size 1m;
    proxy_read_timeout 120s;
    proxy_send_timeout 30s;
    proxy_pass $ai_api;
  }

  # Araçların blokları (API, sağlık ucu, web; gövde sınırı ve zaman aşımları) kayıttan üretilir:
  # Platform/scripts/products-gen.mjs -> conf/products/<anahtar>.conf. Elle düzenlenmez; `^~` ve regex konumu içermez.
  include /etc/nginx/snippets/products/*.conf;

  # Tanımsız API yolu: HTML değil JSON 404.
  location /api/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    default_type application/json;
    return 404 '{"error":{"code":"NOT_FOUND"}}';
  }

  # ---------- Merkez (hub-web) ----------
  # Hashli varlıklar: bir yıl, değişmez.
  location /assets/ {
    include /etc/nginx/snippets/proxy.conf;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    proxy_read_timeout 30s;
    proxy_pass $hub_web;
  }

  # /home, /analytics/*, /data/*, /activity, /account/*, /login, /register, /join, /invite/*, /forgot-password,
  # /reset-password/*, /verify-email/*, web dağıtımı olmayan araçların yolları (/orderloom*, /tagpress*) ve favicon:
  # hepsi hub-web'e gider. Tanımsız yollar da oraya düşer: hub-web SPA'sı "bulunamadı" sayfasını kendisi çizer.
  # HTML hiç önbelleğe alınmaz.
  location ~* ^/(invite|reset-password|verify-email)/ {
    error_log /var/log/nginx/error.log crit;
    include /etc/nginx/snippets/proxy.conf;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    proxy_read_timeout 30s;
    proxy_pass $hub_web;
  }

  location / {
    include /etc/nginx/snippets/proxy.conf;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    proxy_read_timeout 30s;
    proxy_pass $hub_web;
  }
}
