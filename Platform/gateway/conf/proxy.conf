# Ortak vekil ayarları. İstemciden gelen X-Forwarded-* güvenilmez: gateway kendi gördüğünü yazar.
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $sod_scheme;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header Connection "";
proxy_connect_timeout 5s;
# Yukarı akışın kendi güvenlik başlıkları gateway'inkilerle çakışmasın.
proxy_hide_header Content-Security-Policy;
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Strict-Transport-Security;
