# Yanıt sıkıştırma (http düzeyi; imajda conf.d/05-gzip.conf). KALANLAR 3.6, karar mimari/07-guvenlik.md "Sıkıştırma".
#
# Yalnız metin: HTML (nginx hep sayar), JSON, JS, CSS, SVG, CSV, düz metin. Fotoğraf, PDF, Excel (zip), arşiv zaten sıkıştırılmış:
# listede yok, olduğu gibi geçer. Akış yanıtı (text/event-stream) da yok: gzip arabelleğe alıp akışı geciktirirdi.
# Yukarı akış zaten sıkıştırmışsa (Content-Encoding) dokunulmaz; kısmi yanıt (206) sıkıştırılmaz.
#
# BREACH: Hesap API'si (/api/account/) sıkıştırılmaz (default.conf, `gzip off`): oturum, yenileme ve davet jetonu gövdede
# döner, kazanç da küçüktür. Ayrıntı ve öteki yanıtların gerekçesi mimari belgede.
gzip on;
gzip_vary on;
# Önünde vekil (Caddy) varken de: istek `Via` taşısa bile sıkıştır.
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types application/json application/problem+json application/javascript text/javascript text/css image/svg+xml text/plain text/csv application/xml text/xml application/manifest+json;
