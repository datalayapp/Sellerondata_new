# ÜRETİLDİ: Platform/scripts/products-gen.mjs (kaynak contracts/src/products.ts). Elle düzenlemeyin.
# DeciShip (deciship)

set $sod_p_deciship_api http://deciship-api:4000;

# DeciShip API sağlık ucu hız sınırının dışındadır (kapların ve izlemenin yoklaması kısılmasın).
location = /api/deciship/health {
  include /etc/nginx/snippets/proxy.conf;
  include /etc/nginx/snippets/security-headers.conf;
  proxy_read_timeout 30s;
  proxy_pass $sod_p_deciship_api;
}

location /api/deciship/ {
  include /etc/nginx/conf.d/api-limits.inc;
  include /etc/nginx/snippets/proxy.conf;
  include /etc/nginx/snippets/security-headers.conf;
  client_max_body_size 50m;
  client_body_timeout 120s;
  proxy_read_timeout 240s;
  proxy_send_timeout 240s;
  proxy_request_buffering on;
  proxy_pass $sod_p_deciship_api;
}

set $sod_p_deciship_web http://deciship-web:80;

# DeciShip web: Vite base '/deciship/'. Web konteyneri dosyaları da /deciship/ altında sunar: önek olduğu gibi geçer.
location = /deciship {
  include /etc/nginx/snippets/security-headers.conf;
  return 301 /deciship/;
}

location /deciship/assets/ {
  include /etc/nginx/snippets/proxy.conf;
  proxy_hide_header Cache-Control;
  proxy_hide_header Expires;
  include /etc/nginx/snippets/security-headers.conf;
  add_header Cache-Control "public, max-age=31536000, immutable";
  proxy_read_timeout 30s;
  proxy_pass $sod_p_deciship_web;
}

location /deciship/ {
  include /etc/nginx/snippets/proxy.conf;
  proxy_hide_header Cache-Control;
  proxy_hide_header Expires;
  include /etc/nginx/snippets/security-headers.conf;
  add_header Cache-Control "no-cache";
  proxy_read_timeout 30s;
  proxy_pass $sod_p_deciship_web;
}
