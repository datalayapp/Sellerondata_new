# ÜRETİLDİ: Platform/scripts/products-gen.mjs (kaynak contracts/src/products.ts). Elle düzenlemeyin.
# TagPress (tagpress)

set $sod_p_tagpress_api http://tagpress-api:4200;

# TagPress API sağlık ucu hız sınırının dışındadır (kapların ve izlemenin yoklaması kısılmasın).
location = /api/tagpress/health {
  include /etc/nginx/snippets/proxy.conf;
  include /etc/nginx/snippets/security-headers.conf;
  proxy_read_timeout 30s;
  proxy_pass $sod_p_tagpress_api;
}

location /api/tagpress/ {
  include /etc/nginx/conf.d/api-limits.inc;
  include /etc/nginx/snippets/proxy.conf;
  include /etc/nginx/snippets/security-headers.conf;
  client_max_body_size 50m;
  client_body_timeout 120s;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
  proxy_request_buffering on;
  proxy_pass $sod_p_tagpress_api;
}

set $sod_p_tagpress_web http://tagpress-web:80;

# TagPress web: Vite base '/tagpress/'. Web konteyneri dosyaları da /tagpress/ altında sunar: önek olduğu gibi geçer.
location = /tagpress {
  include /etc/nginx/snippets/security-headers.conf;
  return 301 /tagpress/;
}

location /tagpress/assets/ {
  include /etc/nginx/snippets/proxy.conf;
  proxy_hide_header Cache-Control;
  proxy_hide_header Expires;
  include /etc/nginx/snippets/security-headers.conf;
  add_header Cache-Control "public, max-age=31536000, immutable";
  proxy_read_timeout 30s;
  proxy_pass $sod_p_tagpress_web;
}

location /tagpress/ {
  include /etc/nginx/snippets/proxy.conf;
  proxy_hide_header Cache-Control;
  proxy_hide_header Expires;
  include /etc/nginx/snippets/security-headers.conf;
  add_header Cache-Control "no-cache";
  proxy_read_timeout 30s;
  proxy_pass $sod_p_tagpress_web;
}
