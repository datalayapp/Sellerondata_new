# Güvenlik başlıkları (ARCHITECTURE §11). nginx'te bir location kendi add_header'ını tanımlarsa üst düzeydekileri
# devralmaz; bu yüzden her location bu dosyayı kendisi dahil eder.
#
# CSP kararları:
#  - script-src 'self': satır içi betik yok. Vite derlemesi yalnız dış modül betiği üretir.
#    'inline-speculation-rules' yalnız `type=speculationrules` bloklarını açar, yürütülebilir betik açmaz: kabuk araç geçişini önceden çizer (§8).
#  - style-src 'self': derlemede CSS dosyadır. React `style={{}}` CSSOM ile yazar (CSP'ye takılmaz);
#    HTML'de `style="..."` özniteliği ve <style> bloğu kullanılmamalıdır.
#  - img-src 'self' data:: CSS'te data: SVG (select oku) var. blob: gerekmiyor (blob yalnız indirmede).
#  - font-src 'self': yazı tipleri kendi kaynağımızdan; üçüncü taraf yok.
#  - connect-src 'self': tarayıcı yalnız aynı kökene istek atar (/api/*).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'inline-speculation-rules'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
# Varsayılan strict-origin-when-cross-origin; jetonlu sayfada no-referrer ($sod_referrer_policy, default.conf).
add_header Referrer-Policy $sod_referrer_policy always;
# Boş değerli başlık gönderilmez: HSTS yalnız TLS'te ($sod_hsts, default.conf).
add_header Strict-Transport-Security $sod_hsts always;
