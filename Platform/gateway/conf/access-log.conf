# Erişim günlüğü kuralı (http düzeyi). Tek kaynak: gateway, hub-web ve deciship-web imajları bu dosyayı
# /etc/nginx/conf.d/00-access-log.conf olarak alır, sunucuları `access_log ... sod;` yazar (test/access-log.test.mjs denetler).
#
# Bağlantıdaki jeton parola yerine geçer (yolda ya da kayıt davetinde sorguda): erişim günlüğüne düşmez. İstek satırı yalnız maskeli yolla yazılır ($request ve
# $request_uri değil). Referer hiç yazılmaz: jetonlu sayfadan sonraki istekler (varlıklar, sonraki sayfa) o adresi taşıyabilir.
# $request_uri kullanılır, $uri değil: arka uçta try_files iç yönlendirmesi $uri'yi /index.html yapar, maske boşa düşerdi.
# Büyük/küçük harf ve çift eğik çizgi de kapsanır: Merkez'in yönlendiricisi yolu harf duyarsız eşler.
map $request_uri $sod_log_uri {
  default $request_uri;
  ~*^/+(?<sod_tokened>invite|reset-password|verify-email)/ "/$sod_tokened/[gizli]";
  ~*^/+api/account/invites/ "/api/account/invites/[gizli]";
  # Kayıt daveti (kapalı deneme, 2026-11-12) sorgu dizgisinde: /register?invite=<jeton>. Bütün sorgu gizlenir.
  ~*^/+(?<sod_reg>register)/?\? "/$sod_reg?[gizli]";
}
log_format sod '$remote_addr [$time_local] "$request_method $sod_log_uri $server_protocol" $status $body_bytes_sent $request_time "$http_user_agent"';
