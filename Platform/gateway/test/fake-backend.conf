# Sahte yukarı akış: gateway testinde gerçek servislerin yerine geçer. BACKEND_NAME ortam değişkeni şablonla yazılır.
server {
  listen 80;
  listen 4000;
  listen 4100;
  listen 4200;
  listen 4300;
  # Gerçek servis bunu yapabilir: gateway'in kendi başlıklarını yazması gerektiğini sınamak için.
  add_header Content-Security-Policy "default-src *" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Cache-Control "max-age=5";
  # ?rp=<değer>: yukarı akış Referrer-Policy yazar (gateway yalnız daha sıkısını geçirmeli). Boşsa başlık gitmez.
  add_header Referrer-Policy $arg_rp always;
  client_max_body_size 200m;
  # Sıkıştırma denemesi (run.sh "sıkıştırma"): /gz/ altındaki yolun uzantısı türü verir; gövde gzip_min_length üstünde.
  set $sod_pad "sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-sikistirma-denemesi-";
  location ~ /gz/.*\.json$ {
    default_type application/json;
    return 200 "${BACKEND_NAME} $sod_pad\n";
  }
  location ~ /gz/.*\.js$ {
    default_type application/javascript;
    return 200 "${BACKEND_NAME} $sod_pad\n";
  }
  location ~ /gz/.*\.css$ {
    default_type text/css;
    return 200 "${BACKEND_NAME} $sod_pad\n";
  }
  location ~ /gz/.*\.svg$ {
    default_type image/svg+xml;
    return 200 "${BACKEND_NAME} $sod_pad\n";
  }
  location ~ /gz/.*\.html$ {
    default_type text/html;
    return 200 "${BACKEND_NAME} $sod_pad\n";
  }
  location ~ /gz/.*\.txt$ {
    default_type text/plain;
    return 200 "${BACKEND_NAME} $sod_pad\n";
  }
  location ~ /gz/.*\.csv$ {
    default_type text/csv;
    return 200 "${BACKEND_NAME} $sod_pad\n";
  }
  location ~ /gz/.*\.jpg$ {
    default_type image/jpeg;
    return 200 "${BACKEND_NAME} $sod_pad\n";
  }
  location ~ /gz/.*\.pdf$ {
    default_type application/pdf;
    return 200 "${BACKEND_NAME} $sod_pad\n";
  }
  location ~ /gz/.*\.xlsx$ {
    default_type application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;
    return 200 "${BACKEND_NAME} $sod_pad\n";
  }
  location ~ /gz/.*\.sse$ {
    default_type text/event-stream;
    return 200 "${BACKEND_NAME} $sod_pad\n";
  }
  # Olay akışı (TagPress SSE): yukarı akış tamponlamayı kendisi kapatır; gateway başlığı işler, istemciye geçirmez.
  location = /api/tagpress/events {
    default_type text/event-stream;
    add_header X-Accel-Buffering no;
    return 200 "${BACKEND_NAME} data: sse\n";
  }
  location / {
    default_type text/plain;
    return 200 "${BACKEND_NAME} uri=$request_uri host=$http_host xff=$http_x_forwarded_for xri=$http_x_real_ip xfp=$http_x_forwarded_proto\n";
  }
}
