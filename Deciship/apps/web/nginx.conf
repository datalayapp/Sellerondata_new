# Yalnız statik DeciShip web. `/api/*`, güvenlik başlıkları ve yol yönlendirme ağ geçidindedir (ARCHITECTURE §3, §11).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Ağ geçidinin arkasında: yönlendirme iç adresi ve portu sızdırmasın
  absolute_redirect off;
  # Erişim günlüğü gateway ile aynı kuralda: Referer yazılmaz (Merkez'in jetonlu sayfasından gelen istek o adresi taşıyabilir),
  # jetonlu yollar maskeli. Biçim `sod`: Platform/gateway/conf/access-log.conf (imajda conf.d/00-access-log.conf).
  access_log /var/log/nginx/access.log sod;

  location = /deciship {
    return 301 /deciship/;
  }

  location /deciship/assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location = /deciship/site.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Sekme "yeni sürüm var" denetimi: önbelleğe alınmaz, yoksa HTML dönmez
  location = /deciship/version.json {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location /deciship/ {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /deciship/index.html;
  }

  location / {
    return 404;
  }
}
