plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.boxmeasure'
version = '1.0.0'

android {
  namespace "expo.modules.boxmeasure"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
  testOptions {
    unitTests.returnDefaultValues = true
  }
}

dependencies {
  // Plain ARCore + OpenGL ES (Sceneform/SceneView yok — en az bağımlılık).
  implementation 'com.google.ar:core:1.57.0'
  testImplementation 'junit:junit:4.13.2'
}
