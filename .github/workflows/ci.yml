# SellerOnData CI (Mesaj 10: 15-B1, B3, B8, B12, B15). Komutların anlamı: kök package.json ve CLAUDE.md "Testler".
#   secim       her koşuda; ağır işler koşsun mu (scripts/ci-select.mjs: işin son sınandığı commit'ten bu yana ilgili
#               yol değişti mi, bir commit mesajında [db] var mı). Son commit'te [db-sonra]: veritabanı işi bu gönderimde
#               ertelenir, kaybolmaz (sonraki gönderim kapsar).
#   hizli       her koşuda: depo denetimi, lint, tip denetimi, veritabanısız testler (npm test). Aynı dala yeni gönderim
#               süren hızlı işi iptal eder.
#   veritabani  secim isterse, hızlı iş geçince; beş parça (API 3, hesap servisi 2). İptal edilmez: süren biter, en yeni
#               bekleyen sırada kalır.
#   vision      görüntü servisi değişince ya da elle.
#   e2e         her gece (schedule, yalnız bu iş) ve elle (Actions > CI > Run workflow, e2e kutusu): panel ve Merkez
#               Playwright, sahte API. Sonuç: npm run ci:son ("Gece e2e" satırı).
# Yalnız not ve belge (SONRAKI-OTURUM, *.md, .claude) değişen gönderimde CI hiç koşmaz (liste ci-select.mjs ile aynı).
# Docker imajı, gateway, mobil derleme ve gerçek yığın e2e (Platform/e2e) burada YOK. main'e geçmeden: npm run main:ready
name: CI

on:
  push:
    branches: [gelistirme, main]
    paths-ignore:
      - 'SONRAKI-OTURUM/**'
      - '**/*.md'
      - '.claude/**'
  pull_request:
    paths-ignore:
      - 'SONRAKI-OTURUM/**'
      - '**/*.md'
      - '.claude/**'
  # KALANLAR 0.8: her gece 03:17 (İstanbul) varsayılan dalın (gelistirme) ucunda yalnız e2e işi; öteki işler atlanır.
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
    inputs:
      db:
        description: 'Veritabanı testleri de koşsun'
        type: boolean
        default: true
      e2e:
        description: 'Uçtan uca testler de koşsun (panel ve Merkez, sahte API)'
        type: boolean
        default: false

# İş akışı düzeyinde concurrency YOK: o, koşunun tamamını (veritabanı işi dahil) iptal ederdi. İşler kendi grubunda.
permissions:
  contents: read

env:
  TZ: Europe/Istanbul
  CI: 'true'
  npm_config_fund: 'false'
  npm_config_audit: 'false'
  npm_config_update_notifier: 'false'

jobs:
  secim:
    name: Seçim (ağır işler koşsun mu)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      db: ${{ steps.sec.outputs.db }}
      vision: ${{ steps.sec.outputs.vision }}
    steps:
      # Tam geçmiş, içeriksiz (blob:none): git diff ve git log için ağaç ve commit yeter.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - id: sec
        name: Son sınanan commit'ten bu yana değişiklikler
        env:
          GH_TOKEN: ${{ github.token }}
          SOD_DB_INPUT: ${{ inputs.db }}
        run: node scripts/ci-select.mjs

  hizli:
    name: Denetim, lint, tip denetimi, birim testler
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ci-hizli-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            Platform/packages/*/package-lock.json
            Platform/apps/*/package-lock.json
            Deciship/packages/core/package-lock.json
            Deciship/apps/*/package-lock.json
            tools/lint/package-lock.json
      - name: Bağımlılıklar (scripts/install.mjs her klasörde npm ci; tip denetimi api ve hesap servisini de ister)
        run: node scripts/install.mjs --ci
      - name: Depo denetimi, lint, tip denetimi ve veritabanısız testler (npm test)
        run: npm test
      # KALANLAR 0.4: süre eşikli testler bilgi içindir, işi kırmaz (parça gate: false; hesap servisininki veritabanı işinde).
      - name: Süre ölçümleri (bilgi, kapı değil)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: node scripts/test.mjs perf --only api-perf,core-perf
      - name: Kalan parçaların günlük özeti
        if: failure()
        run: |
          for f in .test-logs/*/*.log; do
            echo "== $f"
            grep -nE "FAIL|AssertionError|Error:|Test Files|Tests " "$f" | head -n 80 || true
            tail -n 30 "$f"
          done
      - name: Test günlükleri
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: hizli-gunlukler
          path: .test-logs/
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true

  veritabani:
    name: Veritabanı testleri (${{ matrix.ad }})
    needs: [secim, hizli]
    if: needs.secim.outputs.db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # KALANLAR 0.7: beş parça, her biri kendi Postgres kabıyla (vitest --shard; scripts/test.mjs --shard). Biri kalsa da
    # ötekiler sürer (fail-fast yok). ci-select.mjs ve main-ready.mjs parçaları tek iş gibi toplar (findJob).
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: api-1, ad: 'DeciShip API 1/3', only: api, shard: 1/3 }
          - { id: api-2, ad: 'DeciShip API 2/3', only: api, shard: 2/3 }
          - { id: api-3, ad: 'DeciShip API 3/3', only: api, shard: 3/3 }
          - { id: hesap-1, ad: 'Hesap servisi 1/2, auth-kit', only: 'account,auth-kit-db', shard: 1/2 }
          - { id: hesap-2, ad: 'Hesap servisi 2/2, product-kit', only: 'account,product-kit-db', shard: 2/2 }
    # Yeni gönderim bunu iptal etmez; aynı dalda parça başına en çok bir süren ve bir bekleyen olur (bekleyeni yenisi
    # alır, yenisinin seçimi bekleyenin değişikliklerini de kapsar: ci-select.mjs sırada bekleyeni sınanmış saymaz).
    concurrency:
      group: ci-veritabani-${{ github.ref }}-${{ matrix.id }}
      cancel-in-progress: false
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: sod_postgres_dev
        ports: ['5434:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      PGPASSWORD: sod_postgres_dev
      # init.sql süper kullanıcı parolasını bu değişkenden okur (yerel compose ile aynı varsayılan).
      POSTGRES_PASSWORD: sod_postgres_dev
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            Platform/packages/*/package-lock.json
            Platform/apps/*/package-lock.json
            Deciship/packages/core/package-lock.json
            Deciship/apps/*/package-lock.json
            tools/lint/package-lock.json
      - name: Roller ve veritabanı (init.sql, yerel compose ile aynı)
        run: psql -h localhost -p 5434 -U postgres -d postgres -v ON_ERROR_STOP=1 -f Platform/infra/postgres/init.sql
      - name: Bağımlılıklar (file bağlantıları için hepsi)
        run: node scripts/install.mjs --ci
      - name: Veritabanı testleri (bu parça)
        run: node scripts/test.mjs db --only ${{ matrix.only }} --shard ${{ matrix.shard }}
      - name: Hesap servisi süre ölçümleri (bilgi, kapı değil)
        if: ${{ !cancelled() && matrix.id == 'hesap-1' }}
        continue-on-error: true
        run: node scripts/test.mjs perf --only account-perf
      - name: Kalan parçaların günlük özeti
        if: failure()
        run: |
          for f in .test-logs/*/*.log; do
            echo "== $f"
            grep -nE "FAIL|AssertionError|Error:|Test Files|Tests " "$f" | head -n 80 || true
            tail -n 30 "$f"
          done
      - name: Test günlükleri
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: veritabani-gunlukler-${{ matrix.id }}
          path: .test-logs/
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true

  vision:
    name: Görüntü servisi testleri (Python)
    needs: secim
    if: needs.secim.outputs.vision == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Deciship/services/vision
    steps:
      - uses: actions/checkout@v5
      # Dockerfile ile aynı sürüm (python:3.12-slim).
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            Deciship/services/vision/requirements.txt
            Deciship/services/vision/requirements-dev.txt
      - name: Bağımlılıklar
        run: python -m pip install -r requirements-dev.txt
      - name: Testler
        run: python -m pytest -q

  e2e:
    name: Uçtan uca (panel ve Merkez, sahte API)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            Platform/packages/*/package-lock.json
            Platform/apps/*/package-lock.json
            Deciship/packages/core/package-lock.json
            Deciship/apps/*/package-lock.json
            tools/lint/package-lock.json
      - name: Bağımlılıklar (panel, Merkez ve ortak paketler)
        run: node scripts/install.mjs --ci --group quick
      - id: pw
        name: Playwright sürümü
        run: |
          v() { node -p "JSON.parse(require('fs').readFileSync('$1/node_modules/@playwright/test/package.json','utf8')).version"; }
          echo "v=$(v Deciship/apps/web)-$(v Platform/apps/hub-web)" >> "$GITHUB_OUTPUT"
      - name: Tarayıcı önbelleği
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.v }}
      # Sistem kitaplıkları her seferinde kurulur (önbelleğe girmez); tarayıcı önbellekteyse indirilmez.
      - name: Chromium
        run: |
          (cd Deciship/apps/web && npx playwright install --with-deps chromium)
          (cd Platform/apps/hub-web && npx playwright install chromium)
      - name: Uçtan uca testler (npm run test:e2e)
        run: npm run test:e2e
      - name: Günlükler ve Playwright çıktısı (iz dosyaları)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-gunlukler
          path: .test-logs/
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true
