# Yalnız statik TagPress web (platform yapısı). `/api/*`, güvenlik başlıkları ve yol yönlendirme ağ geçidindedir
# (Platform ARCHITECTURE §3, §11). Yerel kipte (pnpm start) web'i TagPress sunucusu kendisi sunar; bu dosya kullanılmaz.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Ağ geçidinin arkasında: yönlendirme iç adresi ve portu sızdırmasın
  absolute_redirect off;
  # Erişim günlüğü gateway ile aynı kuralda: Referer yazılmaz (Merkez'in jetonlu sayfasından gelen istek o adresi taşıyabilir),
  # jetonlu yollar maskeli. Biçim `sod`: Platform/gateway/conf/access-log.conf (imajda conf.d/00-access-log.conf).
  access_log /var/log/nginx/access.log sod;

  location = /tagpress {
    return 301 /tagpress/;
  }

  location /tagpress/assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Ekranlar hash rotalarıdır (/tagpress/#/uretim); bilinmeyen yol yine uygulamayı açar.
  location /tagpress/ {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /tagpress/index.html;
  }

  location / {
    return 404;
  }
}
